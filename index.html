<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Daily Why</title>
  <meta name="description" content="One everyday topic a day. A five-minute read that actually sticks.">
  <meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-section="general">
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="masthead">
    <div class="bar">
      <a href="#" class="logo" aria-label="The Daily Why, today's topic">
        <span class="logo-mark" aria-hidden="true">?</span>
        <span>The Daily <em>Why</em></span>
      </a>
      <nav class="nav">
        <a href="#" class="streak-chip cold" id="streak-chip" aria-label="Your streak"></a>
        <a href="#archive" class="nav-link" id="archive-link">Archive</a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light or dark mode">
          <svg class="i-sun" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <main id="app" tabindex="-1">
    <p class="loading">Getting today's topic ready…</p>
  </main>

  <footer class="site-footer">
    <p>Three new topics land every morning at 6:00 (South African time): general knowledge, sport and philosophy.</p>
    <p>Facts and photos from <a href="https://en.wikipedia.org" rel="noopener">Wikipedia</a> and Wikimedia Commons, rewritten to be easy to read.</p>
  </footer>

  <!--INLINE-DATA-->
  <script src="assets/app.js"></script>

</html>
