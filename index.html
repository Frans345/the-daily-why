<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Daily Why</title>
  <meta name="description" content="One everyday topic a day. A five-minute read that actually sticks.">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <!--INLINE-STYLE-->
</head>
<body>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

  <header class="masthead">
    <div class="bar">
      <a href="#" class="logo" aria-label="The Daily Why, today's topic">The Daily <em>Why</em></a>
      <nav class="nav">
        <span class="streak" id="streak" hidden></span>
        <a href="#archive" class="nav-link">Archive</a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light or dark mode">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">Loading today's topic…</p>
  </main>

  <footer class="site-footer">
    <p>A new everyday topic every morning at 6:00 (South African time).</p>
    <p>Facts and images from <a href="https://en.wikipedia.org" rel="noopener">Wikipedia</a> and Wikimedia Commons, rewritten for easy reading.</p>
  </footer>

  <!--INLINE-DATA-->
  <script src="assets/app.js"></script>
  <!--INLINE-SCRIPT-->
</body>
</html>
